services:
  - type: web
    name: attendiq-web
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVICE_ROLE
        value: web
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: attendiq-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: attendiq-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: attendiq-redis
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: redis
          name: attendiq-redis
          property: connectionString

  - type: worker
    name: attendiq-celery-worker
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVICE_ROLE
        value: worker
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: attendiq-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: attendiq-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: attendiq-redis
          property: connectionString

  - type: redis
    name: attendiq-redis
    plan: free
    ipAllowList: []

databases:
  - name: attendiq-db
    plan: free