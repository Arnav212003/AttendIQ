services:
  - type: web
    name: attendiq-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVICE_ROLE
        value: web
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: attendiq-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        value: memory://

databases:
  - name: attendiq-db
    plan: free